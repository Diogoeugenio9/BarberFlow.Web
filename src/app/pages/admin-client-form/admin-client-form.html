<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<div class="admin-layout">

  <aside class="sidebar">

    <div class="logo">
      BarberFlow
    </div>

    <div class="gestao">
      Gestão
    </div>

    <nav>

      <div class="menu-item" routerLink="/admin">
        <span>▣</span>
        Dashboard
      </div>

      <div class="menu-item" routerLink="/admin/appointments">
        <span>◷</span>
        Agendamentos
      </div>

      <div class="menu-item" routerLink="/admin/barbers">
        <span>✂</span>
        Barbeiros
      </div>

      <div class="menu-item" routerLink="/admin/services">
        <span>▤</span>
        Serviços
      </div>

      <div class="menu-item ativo" routerLink="/admin/clients">
        <span>♙</span>
        Clientes
      </div>

    </nav>

  </aside>

  <main class="conteudo">

    <header class="header">

      <div>

        <span class="titulo-pequeno">
          Painel administrativo
        </span>

        <h1>
          Editar cliente
        </h1>

      </div>

    </header>

    <section class="formulario">

      <div class="secao-header">

        <div>

          <span class="titulo-pequeno">
            Clientes
          </span>

          <h2>
            Dados do cliente
          </h2>

        </div>

      </div>

      <div *ngIf="carregandoDados" class="mensagem">
        Carregando cliente...
      </div>

      <form *ngIf="!carregandoDados" (ngSubmit)="salvar()">

        <div class="campo">

          <label for="nome">
            Nome
          </label>

          <input
            id="nome"
            type="text"
            name="nome"
            [(ngModel)]="nome"
            placeholder="Digite o nome do cliente"
          >

        </div>

        <div class="campo">

          <label for="email">
            E-mail
          </label>

          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Digite o e-mail do cliente"
          >

        </div>

        <div class="campo">

          <label for="telefone">
            Telefone
          </label>

          <input
            id="telefone"
            type="text"
            name="telefone"
            [(ngModel)]="telefone"
            placeholder="Digite o telefone do cliente"
          >

        </div>

        <div *ngIf="erro" class="erro">
          {{ erro }}
        </div>

        <div class="acoes">

          <button
            type="button"
            class="btn-voltar"
            (click)="voltar()"
          >
            Voltar
          </button>

          <button
            type="submit"
            class="btn-salvar"
            [disabled]="carregando"
          >
            {{ carregando ? 'Salvando...' : 'Salvar alterações' }}
          </button>

        </div>

      </form>

    </section>

  </main>

</div>
