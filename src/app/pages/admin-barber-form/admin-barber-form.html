<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<div class="admin-layout">

  <aside class="sidebar">

    <div class="logo">
      BarberFlow
    </div>

    <div class="gestao">
      Gestão
    </div>

    <nav>

      <div class="menu-item" routerLink="/admin">
        <span>▣</span>
        Dashboard
      </div>

      <div class="menu-item" routerLink="/admin/appointments">
        <span>◷</span>
        Agendamentos
      </div>

      <div class="menu-item ativo">
        <span>✂</span>
        Barbeiros
      </div>

      <div class="menu-item">
        <span>▤</span>
        Serviços
      </div>

      <div class="menu-item">
        <span>♙</span>
        Clientes
      </div>

    </nav>

  </aside>

  <main class="conteudo">

    <header class="header">

      <div>
        <span class="titulo-pequeno">
          Painel administrativo
        </span>

        <h1>
          Novo Barbeiro
        </h1>
      </div>

    </header>

    <section class="formulario">

      <div class="secao-header">

        <span class="titulo-pequeno">
          Equipe
        </span>

        <h2>
          Cadastrar barbeiro
        </h2>

      </div>

      <div
        *ngIf="erro"
        class="erro">

        {{ erro }}

      </div>

      <div class="campos">

        <div class="campo">

          <label>
            Nome
          </label>

          <input
            type="text"
            placeholder="Digite o nome do barbeiro"
            [(ngModel)]="nome">

        </div>

        <div class="campo">

          <label>
            E-mail
          </label>

          <input
            type="email"
            placeholder="Digite o e-mail"
            [(ngModel)]="email">

        </div>

        <div class="campo">

          <label>
            Telefone
          </label>

          <input
            type="text"
            placeholder="Digite o telefone"
            [(ngModel)]="telefone">

        </div>

        <div class="campo">

          <label>
            Especialidade
          </label>

          <input
            type="text"
            placeholder="Ex: Corte masculino"
            [(ngModel)]="especialidade">

        </div>

      </div>

      <div class="acoes">

        <button
          type="button"
          class="btn-cancelar"
          (click)="voltar()">

          Cancelar

        </button>

        <button
          type="button"
          class="btn-cadastrar"
          (click)="cadastrar()"
          [disabled]="carregando">

          <span *ngIf="!carregando">
            Cadastrar
          </span>

          <span *ngIf="carregando">
            Cadastrando...
          </span>

        </button>

      </div>

    </section>

  </main>

</div>
