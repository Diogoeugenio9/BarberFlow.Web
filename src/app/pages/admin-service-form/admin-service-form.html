<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<div class="admin-layout">

  <aside class="sidebar">

    <div class="logo">
      BarberFlow
    </div>

    <div class="gestao">
      Gestão
    </div>

    <nav>

      <div class="menu-item" routerLink="/admin">
        <span>▣</span>
        Dashboard
      </div>

      <div class="menu-item" routerLink="/admin/appointments">
        <span>◷</span>
        Agendamentos
      </div>

      <div class="menu-item" routerLink="/admin/barbers">
        <span>✂</span>
        Barbeiros
      </div>

      <div class="menu-item ativo" routerLink="/admin/services">
        <span>▤</span>
        Serviços
      </div>

      <div class="menu-item">
        <span>♙</span>
        Clientes
      </div>

    </nav>

  </aside>

  <main class="conteudo">

    <header class="header">

      <div>

        <span class="titulo-pequeno">
          Painel administrativo
        </span>

        <h1>
          {{ id ? 'Editar Serviço' : 'Novo Serviço' }}
        </h1>

      </div>

    </header>

    <section class="formulario">

      <div class="secao-header">

        <div>

          <span class="titulo-pequeno">
            Catálogo
          </span>

          <h2>
            {{ id ? 'Atualizar serviço' : 'Cadastrar serviço' }}
          </h2>

        </div>

      </div>

      <div
        *ngIf="carregandoDados"
        class="mensagem">

        Carregando serviço...

      </div>

      <form
        *ngIf="!carregandoDados"
        (ngSubmit)="salvar()">

        <div class="campo">

          <label for="nome">
            Nome do serviço
          </label>

          <input
            id="nome"
            type="text"
            [(ngModel)]="nome"
            name="nome"
            placeholder="Ex: Corte Masculino">

        </div>

        <div class="linha">

          <div class="campo">

            <label for="preco">
              Preço
            </label>

            <input
              id="preco"
              type="number"
              [(ngModel)]="preco"
              name="preco"
              min="0"
              step="0.01"
              placeholder="0,00">

          </div>

          <div class="campo">

            <label for="duracao">
              Duração em minutos
            </label>

            <input
              id="duracao"
              type="number"
              [(ngModel)]="duracao"
              name="duracao"
              min="1"
              placeholder="Ex: 30">

          </div>

        </div>

        <div
          *ngIf="erro"
          class="erro">

          {{ erro }}

        </div>

        <div class="acoes">

          <button
            type="button"
            class="btn-voltar"
            (click)="voltar()">

            Voltar

          </button>

          <button
            type="submit"
            class="btn-salvar"
            [disabled]="carregando">

            <span *ngIf="!carregando">
              {{ id ? 'Atualizar' : 'Cadastrar' }}
            </span>

            <span *ngIf="carregando">
              {{ id ? 'Atualizando...' : 'Cadastrando...' }}
            </span>

          </button>

        </div>

      </form>

    </section>

  </main>

</div>
